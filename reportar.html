<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reportar Nuevo Incidente Técnico</h1>
            <p>Soporte Inmediato - Data Center</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reportar.html" class="active">Reportar Incidente</a></li>
                <li><a href="tickets.html">Panel de Tickets</a></li>
            </ul>
        </nav>

        <main>
            <h2>Formulario de Registro de Ticket</h2>
            <form action="tickets.html" method="get">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Institucional:</label>
                    <input type="email" id="correo" class="form-control" required placeholder="ejemplo@utm.edu.ec">
                </div>

                <div class="form-group">
                    <label for="prioridad">Nivel de Prioridad:</label>
                    <select id="prioridad" class="form-control" required>
                        <option value="">-- Seleccione una prioridad --</option>
                        <option value="baja">Baja - Consulta</option>
                        <option value="media">Media - Falla Parcial</option>
                        <option value="alta">Alta - Caída de Servicio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción del Problema:</label>
                    <textarea id="descripcion" class="form-control" rows="4" required placeholder="Detalles del fallo..."></textarea>
                </div>

                <div style="margin-top: 20px;">
                    <input type="submit" class="btn btn-primary" value="Enviar Ticket">
                    <input type="reset" class="btn btn-secondary" value="Limpiar">
                </div>
            </form>
        </main>
    </div>
</body>
</html>
